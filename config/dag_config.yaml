# =============================================================================
# Databricks Job Runner — DAG Configuration
# =============================================================================
#
# assets
#   Each entry defines an Airflow Asset that external systems (Databricks,
#   loaders, etc.) emit via the Airflow REST API.
#   Assets have no producer DAG — they are emitted entirely from outside
#   Airflow using POST /api/v2/assets/events (see tools/emit_asset.py).
#
#   Fields:
#     name            – identifier used in jobs.depends_on
#     uri             – unique asset URI registered in Airflow
#     metadata_fields – optional list of extra keys expected in each event;
#                       documented here for reference, not enforced by Airflow
#
# jobs
#   Each entry creates one dbx_job_runner__<name> DAG.
#   Fields:
#     job_name    – Databricks display name; job_id is looked up at runtime
#     operation   – AND → all depends_on assets must be emitted (AssetAll)
#                   OR  → any one of them is enough             (AssetAny)
#     depends_on  – list of asset names (must match assets[*].name above)
#
#   {YYYYMMDD} in any parameter value is replaced with the resolved date.
#   date_mode is passed as a DAG param at trigger time (default: Yesterday).
# =============================================================================

# ── Single connection used by all jobs ───────────────────────────────────────
databricks_conn_id: "databricks_default"

# ── Assets emitted externally (Databricks, loaders, REST API) ────────────────
assets:
  - name: "sales_data_ready"
    uri: "dbx+sql://sales_data_ready"
    metadata_fields:          # keys expected in every emitted asset event
      - row_count             # number of rows processed / loaded
      - source                # system/job that produced this event
      - date                  # YYYYMMDD of the data partition

  - name: "inventory_data_ready"
    uri: "dbx+sql://inventory_data_ready"
    metadata_fields:
      - row_count
      - source
      - date

  # ── Add more assets here ──────────────────────────────────────────────────
  # - name: "orders_data_ready"
  #   uri: "dbx+sql://orders_data_ready"
  #   metadata_fields: [row_count, source, date]

# ── Databricks Jobs ───────────────────────────────────────────────────────────
jobs:
  - name: "process_sales"
    job_name: "Process Sales Job"
    operation: "AND"                    # all listed assets must be ready
    depends_on:
      - "sales_data_ready"
      - "inventory_data_ready"
    notebook_params:
      date: "{YYYYMMDD}"
      environment: "prod"
    python_params: []
    spark_submit_params: []

  - name: "generate_daily_report"
    job_name: "Daily Report Generator"
    operation: "OR"                     # any one asset being ready is enough
    depends_on:
      - "sales_data_ready"
    notebook_params:
      date: "{YYYYMMDD}"
      report_type: "daily"
    python_params: []
    spark_submit_params: []

