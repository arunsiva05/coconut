# =============================================================================
# DBX SQL Sensor + Job Runner — DAG Configuration
# =============================================================================
#
# databricks_conn_id
#   Single fixed Airflow connection used by every sensor and every job.
#
# sensors.checks
#   Each entry polls a Databricks SQL endpoint.
#   The placeholder {YYYYMMDD} in sql is replaced at runtime with the date
#   resolved from the date_mode DAG param (Today | Yesterday | Custom).
#   On success, each check emits the named Airflow Asset.
#
# jobs
#   Each job entry specifies:
#     job_name    – Databricks display name; job_id is looked up at runtime.
#     operation   – AND → all listed depends_on assets must be emitted (AssetAll)
#                   OR  → any one of them is enough                   (AssetAny)
#     depends_on  – list of sensor check names whose assets gate this job.
#
# date_mode is NOT stored here.  Pass it as a DAG param at trigger time.
# Default is "Yesterday".  Valid values: Today | Yesterday | Custom
# When Custom, also pass custom_date (YYYYMMDD).
# =============================================================================

# ── Single connection used by all sensors and jobs ───────────────────────────
databricks_conn_id: "databricks_default"

# ── SQL Sensor checks ─────────────────────────────────────────────────────────
sensors:
  checks:
    - name: "sales_data_ready"
      sql: >
        SELECT COUNT(*) AS cnt
        FROM   main.default.sales
        WHERE  sale_date = '{YYYYMMDD}'
        HAVING COUNT(*) > 0
      asset_name: "sales_data_ready"
      poke_interval: 60       # seconds between SQL polls
      timeout: 7200           # max seconds to wait

    - name: "inventory_data_ready"
      sql: >
        SELECT 1
        FROM   main.default.inventory
        WHERE  report_date = '{YYYYMMDD}'
        LIMIT  1
      asset_name: "inventory_data_ready"
      poke_interval: 60
      timeout: 7200

    # ── Add more checks here ──────────────────────────────────────────────────
    # - name: "orders_data_ready"
    #   sql: >
    #     SELECT 1 FROM main.default.orders
    #     WHERE order_date = '{YYYYMMDD}' LIMIT 1
    #   asset_name: "orders_data_ready"
    #   poke_interval: 60
    #   timeout: 7200

# ── Databricks Jobs ───────────────────────────────────────────────────────────
# job_name is the Databricks display name; job_id is resolved at runtime.
# operation and depends_on are per-job.
# {YYYYMMDD} in any parameter value is replaced with the resolved date.
jobs:
  - name: "process_sales"
    job_name: "Process Sales Job"
    operation: "AND"                    # all listed assets must be ready
    depends_on:
      - "sales_data_ready"
      - "inventory_data_ready"
    notebook_params:
      date: "{YYYYMMDD}"
      environment: "prod"
    python_params: []
    spark_submit_params: []

  - name: "generate_daily_report"
    job_name: "Daily Report Generator"
    operation: "OR"                     # any one asset being ready is enough
    depends_on:
      - "sales_data_ready"
    notebook_params:
      date: "{YYYYMMDD}"
      report_type: "daily"
    python_params: []
    spark_submit_params: []

