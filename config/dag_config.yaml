# =============================================================================
# DBX SQL Sensor + Job Runner — DAG Configuration
# =============================================================================
#
# date_mode:   Today | Yesterday | Custom
#              Determines what YYYYMMDD is substituted into SQL queries and
#              job parameters at runtime.
# custom_date: Only used when date_mode: Custom
#              Format: YYYYMMDD  (e.g. "20240315")
#
# sensors.operation: AND → all sensors must succeed before jobs run (AssetAll)
#                    OR  → any sensor succeeding is enough        (AssetAny)
#
# In SQL queries and notebook_params values, the token {YYYYMMDD} is replaced
# at task-execution time with the resolved date string.
# =============================================================================

date_mode: "Yesterday"        # Today | Yesterday | Custom
custom_date:                  # YYYYMMDD — only relevant when date_mode: Custom

# -----------------------------------------------------------------------------
# SQL Sensor checks
# Each check polls a Databricks SQL endpoint until the query returns a
# truthy result, then emits the named Airflow Asset.
# -----------------------------------------------------------------------------
sensors:
  operation: "AND"            # AND | OR

  checks:
    - name: "sales_data_ready"
      connection_id: "databricks_default"
      sql: >
        SELECT COUNT(*) AS cnt
        FROM   main.default.sales
        WHERE  sale_date = '{YYYYMMDD}'
        HAVING COUNT(*) > 0
      asset_name: "sales_data_ready"
      poke_interval: 60       # seconds between each SQL poll
      timeout: 7200           # max seconds to wait before failing

    - name: "inventory_data_ready"
      connection_id: "databricks_default"
      sql: >
        SELECT 1
        FROM   main.default.inventory
        WHERE  report_date = '{YYYYMMDD}'
        LIMIT  1
      asset_name: "inventory_data_ready"
      poke_interval: 60
      timeout: 7200

    # ── Add more checks here ──────────────────────────────────────────────
    # - name: "orders_data_ready"
    #   connection_id: "databricks_default"
    #   sql: >
    #     SELECT 1 FROM main.default.orders
    #     WHERE  order_date = '{YYYYMMDD}' LIMIT 1
    #   asset_name: "orders_data_ready"
    #   poke_interval: 60
    #   timeout: 7200

# -----------------------------------------------------------------------------
# Databricks Jobs
# Triggered when the asset conditions above are satisfied.
# {YYYYMMDD} in any string value is replaced with the resolved date.
# -----------------------------------------------------------------------------
jobs:
  - name: "process_sales"
    connection_id: "databricks_default"
    job_id: "123456789"
    notebook_params:
      date: "{YYYYMMDD}"
      environment: "prod"
    python_params: []
    spark_submit_params: []

  - name: "generate_daily_report"
    connection_id: "databricks_default"
    job_id: "987654321"
    notebook_params:
      date: "{YYYYMMDD}"
      report_type: "daily"
    python_params: []
    spark_submit_params: []

